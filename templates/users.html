{% extends "base.html" %}
{% block content %}
<h2>All Users</h2>
{% if users %}
<ul class="user-list">
    {% for user in users %}
    <li><a href="{{ url_for('start_chat', user_id=user.id) }}">{{ user.username }}</a></li>
    {% endfor %}
</ul>
{% else %}
<p>No other users are available yet.</p>
{% endif %}
{% endblock %}
